<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>奇幻怪獸拼貼樂園 - 創意手作與著色</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fabric.js CDN for robust touch canvas manipulation and freehand drawing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts for playful craft aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at 10% 20%, #fff9e6 0%, #ffeecf 100%);
    }

    .brand-font {
      font-family: 'Mochiy Pop One', 'Fredoka One', cursive;
    }

    /* Paper cut craft shadow effect */
    .paper-shadow {
      box-shadow: 0 8px 24px -4px rgba(90, 60, 20, 0.15), 0 3px 6px -2px rgba(90, 60, 20, 0.1);
    }
    
    .craft-card {
      background: #ffffff;
      border: 3px solid #f0e6d6;
      border-radius: 1.25rem;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .craft-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -3px rgba(180, 100, 30, 0.15);
      border-color: #ffd166;
    }

    .craft-card:active {
      transform: scale(0.96);
    }

    /* Custom scrollbar for touch device and horizontal scroll trays */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Canvas desk frame texture */
    .desk-board {
      background-color: #ffffff;
      background-image: 
        radial-gradient(#e7ded0 1.2px, transparent 1.2px),
        radial-gradient(#e7ded0 1.2px, #faf7f2 1.2px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    /* Smooth animated pulse for active tool */
    .tool-active {
      border-color: #f97316 !important;
      background-color: #ffedd5 !important;
      color: #ea580c !important;
      transform: translateY(-1px);
    }

    /* Custom modal styling */
    .toast-animate {
      animation: floatUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes floatUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-slate-800">

  <!-- Top Navigation Header -->
  <header class="bg-amber-50/90 backdrop-blur border-b-2 border-amber-200 px-4 py-2 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white text-xl shadow-md transform -rotate-3">
        👾
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-bold tracking-tight text-amber-900 brand-font flex items-center gap-1.5 flex-wrap">
          奇幻怪獸拼貼樂園
          <span class="text-xs px-2.5 py-0.5 bg-purple-100 text-purple-800 font-bold rounded-full border border-purple-300">
            設計：陳佳釧老師
          </span>
          <span class="text-xs px-2 py-0.5 bg-orange-100 text-orange-700 font-semibold rounded-full border border-orange-300 hidden sm:inline-block">
            免登入即可創作
          </span>
        </h1>
        <p class="text-[11px] text-amber-700/80 -mt-0.5">剪紙立體怪物 × 自由著色 × 觸控手寫簽名</p>
      </div>
    </div>

    <!-- Top Action Buttons -->
    <div class="flex items-center gap-2">
      <!-- Student Name Input & Canvas Badge Generator -->
      <div class="flex items-center gap-1 bg-purple-50/80 p-1 rounded-xl border border-purple-200">
        <input id="studentNameInput" type="text" placeholder="輸入你的名字" class="w-24 sm:w-28 text-xs px-2 py-1 rounded-lg border border-purple-300 focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white font-medium" maxlength="10">
        <button id="btnQuickStamp" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-purple-600 text-white font-bold text-xs hover:bg-purple-700 active:scale-95 transition shadow-sm whitespace-nowrap" title="在畫布上放上自己的名字名牌">
          <i class="fa-solid fa-id-badge text-xs"></i>
          <span>放上名字名牌</span>
        </button>
      </div>

      <!-- Clear Canvas -->
      <button id="btnClear" class="p-2 md:px-3 md:py-1.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 text-xs md:text-sm font-bold hover:bg-rose-100 active:scale-95 transition flex items-center gap-1">
        <i class="fa-solid fa-trash-can"></i>
        <span class="hidden sm:inline">清空重來</span>
      </button>

      <!-- Save Photo / Export -->
      <button id="btnExport" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold text-xs md:text-sm shadow-md hover:brightness-105 active:scale-95 transition">
        <i class="fa-solid fa-camera"></i>
        <span>存成照片</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace (Full viewport flexible layout) -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- Left / Top Tool Panel (Shapes, Parts, Drawing, Colors) -->
    <aside class="w-full md:w-80 lg:w-96 bg-white/95 border-b-2 md:border-b-0 md:border-r-2 border-amber-200 flex flex-col shrink-0 z-10 shadow-lg md:h-full max-h-[38vh] md:max-h-full">
      
      <!-- Primary Tab Navigation -->
      <div class="flex border-b border-amber-200 bg-amber-100/50 p-1.5 gap-1 shrink-0 overflow-x-auto no-scrollbar">
        <button data-tab="bodies" class="tab-btn active-tab flex-1 py-2 px-2 text-xs md:text-sm font-black rounded-lg text-amber-900 bg-white shadow-sm flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-shapes text-orange-500"></i> 怪獸形體
        </button>
        <button data-tab="parts" class="tab-btn flex-1 py-2 px-2 text-xs md:text-sm font-black rounded-lg text-amber-800 hover:bg-white/60 flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-eye text-emerald-500"></i> 五官與手腳
        </button>
        <button data-tab="paint" class="tab-btn flex-1 py-2 px-2 text-xs md:text-sm font-black rounded-lg text-amber-800 hover:bg-white/60 flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-pen-nib text-purple-500"></i> 觸控手寫
        </button>
      </div>

      <!-- Tab Content Area (Scrollable) -->
      <div class="flex-1 overflow-y-auto p-3 space-y-3.5 no-scrollbar">

        <!-- TAB 1: Monster Bodies (At least 3 distinct shapes, in craft paper style) -->
        <section id="tab-bodies" class="space-y-3">
          <div class="flex items-center justify-between text-xs text-amber-800 font-bold">
            <span>選擇形體加入畫布（可放很多隻）：</span>
            <span class="text-[11px] text-orange-600 bg-orange-50 px-2 py-0.5 rounded-full border border-orange-200">點擊即加入</span>
          </div>

          <!-- Body Shapes Grid -->
          <div class="grid grid-cols-2 gap-2.5">
            <!-- 1. White Ghost Monster (New) -->
            <button class="craft-card p-2.5 flex flex-col items-center gap-1.5 group bg-slate-50 hover:bg-white" onclick="addMonsterBody('white_ghost')">
              <svg width="74" height="60" viewBox="0 0 100 80" class="filter drop-shadow-sm group-hover:scale-105 transition">
                <path d="M 50 14 C 30 14 22 36 22 56 Q 30 68 40 58 Q 50 68 60 58 Q 70 68 78 56 C 78 36 70 14 50 14 Z" fill="#ffffff" stroke="#2b2d42" stroke-width="3.5" stroke-linejoin="round"/>
              </svg>
              <span class="text-xs font-bold text-slate-800 flex items-center gap-1">
                👻 白色幽靈怪
              </span>
            </button>

            <!-- 2. Orange Pumpkin Monster (New) -->
            <button class="craft-card p-2.5 flex flex-col items-center gap-1.5 group" onclick="addMonsterBody('pumpkin')">
              <svg width="74" height="60" viewBox="0 0 100 80" class="filter drop-shadow-sm group-hover:scale-105 transition">
                <rect x="46" y="8" width="8" height="12" rx="3" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
                <ellipse cx="50" cy="48" rx="42" ry="28" fill="#ea580c" stroke="#431407" stroke-width="3.5"/>
                <ellipse cx="50" cy="48" rx="26" ry="27" fill="#f97316" stroke="#431407" stroke-width="2.5"/>
                <ellipse cx="50" cy="48" rx="14" ry="25" fill="#fb923c" stroke="#431407" stroke-width="2"/>
              </svg>
              <span class="text-xs font-bold text-slate-800 flex items-center gap-1">
                🎃 橘色南瓜怪
              </span>
            </button>

            <!-- 3. Oval Bean Monster (Yellow in photo) -->
            <button class="craft-card p-2.5 flex flex-col items-center gap-1.5 group" onclick="addMonsterBody('oval')">
              <svg width="74" height="60" viewBox="0 0 100 80" class="filter drop-shadow-sm group-hover:scale-105 transition">
                <ellipse cx="50" cy="40" rx="46" ry="32" fill="#ffd166" stroke="#2b2d42" stroke-width="3.5" />
                <ellipse cx="40" cy="30" rx="12" ry="5" fill="#ffe29a" opacity="0.6"/>
              </svg>
              <span class="text-xs font-bold text-slate-700">胖胖橢圓豆豆怪</span>
            </button>

            <!-- 4. Horned Spiky Monster (Dark monster in photo) -->
            <button class="craft-card p-2.5 flex flex-col items-center gap-1.5 group" onclick="addMonsterBody('horned')">
              <svg width="74" height="60" viewBox="0 0 100 80" class="filter drop-shadow-sm group-hover:scale-105 transition">
                <path d="M20 70 L20 30 L32 10 L44 26 L56 26 L68 10 L80 30 L80 70 Z" fill="#3a405a" stroke="#1d202d" stroke-width="3.5" stroke-linejoin="round"/>
                <polygon points="32,10 44,26 24,28" fill="#525b7f" opacity="0.7"/>
              </svg>
              <span class="text-xs font-bold text-slate-700">三叉狂野角怪</span>
            </button>

            <!-- 5. Scalloped Jellyfish Monster (Purple one in photo) -->
            <button class="craft-card p-2.5 flex flex-col items-center gap-1.5 group" onclick="addMonsterBody('jelly')">
              <svg width="74" height="60" viewBox="0 0 100 80" class="filter drop-shadow-sm group-hover:scale-105 transition">
                <path d="M18 68 Q18 16 50 16 Q82 16 82 68 L72 60 L62 68 L52 60 L42 68 L32 60 L22 68 Z" fill="#9d4edd" stroke="#240046" stroke-width="3.5" stroke-linejoin="round" />
              </svg>
              <span class="text-xs font-bold text-slate-700">流蘇水母怪</span>
            </button>

            <!-- 6. Square Block Robot Monster (Orange in photo) -->
            <button class="craft-card p-2.5 flex flex-col items-center gap-1.5 group" onclick="addMonsterBody('rect')">
              <svg width="74" height="60" viewBox="0 0 100 80" class="filter drop-shadow-sm group-hover:scale-105 transition">
                <rect x="22" y="16" width="56" height="52" rx="14" fill="#ff70a6" stroke="#59132d" stroke-width="3.5"/>
                <rect x="30" y="24" width="40" height="36" rx="8" fill="#ff99c8" opacity="0.6"/>
              </svg>
              <span class="text-xs font-bold text-slate-700">圓角方塊怪</span>
            </button>

            <!-- 7. Chubby Pear Monster -->
            <button class="craft-card p-2.5 flex flex-col items-center gap-1.5 group" onclick="addMonsterBody('blob')">
              <svg width="74" height="60" viewBox="0 0 100 80" class="filter drop-shadow-sm group-hover:scale-105 transition">
                <path d="M32 28 C26 12 74 12 68 28 C88 40 88 72 50 72 C12 72 12 40 32 28 Z" fill="#06d6a0" stroke="#045a43" stroke-width="3.5"/>
              </svg>
              <span class="text-xs font-bold text-slate-700">梨形泡泡怪</span>
            </button>

            <!-- 8. Wave Bottom Ghost -->
            <button class="craft-card p-2.5 flex flex-col items-center gap-1.5 group" onclick="addMonsterBody('ghost')">
              <svg width="74" height="60" viewBox="0 0 100 80" class="filter drop-shadow-sm group-hover:scale-105 transition">
                <path d="M22 68 C16 40 25 15 50 15 C75 15 84 40 78 68 Q64 56 50 68 Q36 56 22 68 Z" fill="#4ea8de" stroke="#163952" stroke-width="3.5"/>
              </svg>
              <span class="text-xs font-bold text-slate-700">淘氣波浪怪</span>
            </button>
          </div>
        </section>

        <!-- TAB 2: Facial Features & Limbs (Collage parts) -->
        <section id="tab-parts" class="space-y-3 hidden">
          <!-- Subcategory Filter Pills -->
          <div class="flex items-center gap-1 text-xs border-b border-amber-100 pb-2">
            <button class="part-filter-btn px-2.5 py-1 rounded-full bg-amber-600 text-white font-bold" data-category="eyes">大眼晴</button>
            <button class="part-filter-btn px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-bold hover:bg-amber-200" data-category="mouths">怪獸大嘴</button>
            <button class="part-filter-btn px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-bold hover:bg-amber-200" data-category="limbs">長手長腳</button>
            <button class="part-filter-btn px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-bold hover:bg-amber-200" data-category="decor">犄角與斑紋</button>
          </div>

          <!-- Items Grid: Eyes -->
          <div id="cat-eyes" class="parts-grid grid grid-cols-3 gap-2">
            <!-- Big Single Eye -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('eye_single')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="24" fill="#ffffff" stroke="#222" stroke-width="3"/>
                <circle cx="34" cy="30" r="10" fill="#111"/>
                <circle cx="37" cy="27" r="3.5" fill="#fff"/>
              </svg>
              <span class="text-[10px] font-bold">逗趣大眼</span>
            </button>

            <!-- Three Eyes Gang -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('eye_triple')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <circle cx="16" cy="34" r="12" fill="#fff" stroke="#222" stroke-width="2.5"/>
                <circle cx="16" cy="34" r="5" fill="#111"/>
                <circle cx="30" cy="24" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
                <circle cx="32" cy="22" r="6" fill="#111"/>
                <circle cx="44" cy="34" r="12" fill="#fff" stroke="#222" stroke-width="2.5"/>
                <circle cx="43" cy="35" r="5" fill="#111"/>
              </svg>
              <span class="text-[10px] font-bold">三連眼怪</span>
            </button>

            <!-- Googly Pupil Eyes Pair -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('eye_pair_wonky')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <circle cx="20" cy="30" r="15" fill="#fff9db" stroke="#222" stroke-width="2.5"/>
                <circle cx="15" cy="34" r="6" fill="#2b2d42"/>
                <circle cx="42" cy="30" r="15" fill="#fff9db" stroke="#222" stroke-width="2.5"/>
                <circle cx="45" cy="26" r="6" fill="#2b2d42"/>
              </svg>
              <span class="text-[10px] font-bold">鬥雞雙眼</span>
            </button>

            <!-- Cyclops Cute -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('eye_color_ring')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="23" fill="#ffd166" stroke="#222" stroke-width="2.5"/>
                <circle cx="30" cy="30" r="15" fill="#ffffff" stroke="#222" stroke-width="2"/>
                <circle cx="30" cy="30" r="7" fill="#0077b6"/>
              </svg>
              <span class="text-[10px] font-bold">彩色彩虹眼</span>
            </button>

            <!-- Sleepy Eye -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('eye_sleepy')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="22" fill="#fff" stroke="#222" stroke-width="2.5"/>
                <circle cx="30" cy="33" r="8" fill="#222"/>
                <path d="M8 30 Q30 38 52 30" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
              </svg>
              <span class="text-[10px] font-bold">愛睏半瞇眼</span>
            </button>

            <!-- Star Eye -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('eye_star')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <circle cx="30" cy="30" r="23" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
                <polygon points="30,16 33,25 43,26 35,32 38,42 30,36 22,42 25,32 17,26 27,25" fill="#e63946"/>
              </svg>
              <span class="text-[10px] font-bold">星星崇拜眼</span>
            </button>
          </div>

          <!-- Items Grid: Mouths -->
          <div id="cat-mouths" class="parts-grid grid grid-cols-3 gap-2 hidden">
            <!-- Wide Grin with 2 teeth -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('mouth_grin_2teeth')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <path d="M12 25 Q30 50 48 25 Z" fill="#222" stroke="#222" stroke-width="2"/>
                <rect x="22" y="25" width="6" height="8" rx="1" fill="#fff"/>
                <rect x="32" y="25" width="6" height="8" rx="1" fill="#fff"/>
              </svg>
              <span class="text-[10px] font-bold">門牙咧嘴笑</span>
            </button>

            <!-- Sharp Fangs Monster Mouth -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('mouth_fangs')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <path d="M10 26 Q30 54 50 26 Z" fill="#c1121f" stroke="#222" stroke-width="2"/>
                <polygon points="18,26 22,38 26,26" fill="#fff"/>
                <polygon points="34,26 38,38 42,26" fill="#fff"/>
              </svg>
              <span class="text-[10px] font-bold">尖牙吸血鬼</span>
            </button>

            <!-- Flat Paper Stick Mouth -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('mouth_paper_bar')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <rect x="10" y="26" width="40" height="8" rx="4" fill="#0077b6" stroke="#222" stroke-width="2"/>
                <rect x="25" y="23" width="5" height="14" rx="2" fill="#fff" stroke="#222" stroke-width="1.5"/>
              </svg>
              <span class="text-[10px] font-bold">貼條木偶嘴</span>
            </button>

            <!-- Stitched Frankenstein Mouth -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('mouth_stitched')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <line x1="12" y1="30" x2="48" y2="30" stroke="#222" stroke-width="3" stroke-linecap="round"/>
                <line x1="20" y1="23" x2="20" y2="37" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="30" y1="21" x2="30" y2="39" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="40" y1="23" x2="40" y2="37" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
              <span class="text-[10px] font-bold">縫線怪客嘴</span>
            </button>

            <!-- Big Tongue Out -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('mouth_tongue')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <path d="M12 28 Q30 46 48 28 Z" fill="#222"/>
                <path d="M22 34 Q30 52 38 34" fill="#ff4d6d" stroke="#222" stroke-width="2"/>
              </svg>
              <span class="text-[10px] font-bold">吐舌調皮嘴</span>
            </button>

            <!-- Kiss O-mouth -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('mouth_circle_o')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <ellipse cx="30" cy="30" rx="12" ry="16" fill="#2b2d42" stroke="#222" stroke-width="2"/>
                <ellipse cx="30" cy="30" rx="6" ry="9" fill="#ff758f"/>
              </svg>
              <span class="text-[10px] font-bold">圓圈大驚奇</span>
            </button>
          </div>

          <!-- Items Grid: Limbs (Striped legs and bendy arms from reference photo) -->
          <div id="cat-limbs" class="parts-grid grid grid-cols-3 gap-2 hidden">
            <!-- Striped Long Leg (Like purple & black legs in photo) -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('limb_striped_leg')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <rect x="22" y="6" width="16" height="42" fill="#52b788" stroke="#1b4332" stroke-width="2"/>
                <line x1="22" y1="16" x2="38" y2="16" stroke="#1b4332" stroke-width="3"/>
                <line x1="22" y1="26" x2="38" y2="26" stroke="#1b4332" stroke-width="3"/>
                <line x1="22" y1="36" x2="38" y2="36" stroke="#1b4332" stroke-width="3"/>
                <rect x="20" y="44" width="20" height="8" rx="2" fill="#1b4332"/>
              </svg>
              <span class="text-[10px] font-bold">條紋長腳</span>
            </button>

            <!-- Patterned Long Arm (Green arm in photo) -->
            <button class="craft-card p-2 flex flex-col items-center gap-1" onclick="addCollagePart('limb_pattern_arm')">
              <svg width="48" height="48" viewBox="0 0 60 60">
                <path d="M12 12 Q40 20 44 48" fill="none" stroke="#2a9d8f" stroke-width="12" stroke-linecap="round"/>
                <circle cx="24" cy="18" r="2.5" fill="#fff"/>
                <circle cx="36" cy="30" r="2.5" fill="#fff"/>

  <script>
    // Global Canvas & State Variables
    let canvas = null;
    let isDrawing = false;
    let currentPenColor = '#1e293b';
    let currentPenWidth = 6;

    // Toast Notification Helper
    function showToast(msg, icon = 'fa-circle-check text-emerald-400') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.querySelector('i').className = `fa-solid ${icon}`;
      toast.classList.remove('opacity-0');
      toast.classList.add('toast-animate');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
        toast.classList.remove('toast-animate');
      }, 2400);
    }

    // Initialize Fabric Canvas on Page Load
    function initCanvas() {
      const container = document.getElementById('canvasContainer');
      const maxWidth = Math.min(container.clientWidth - 16, 960);
      const maxHeight = Math.min(container.clientHeight - 16, 720);

      let targetWidth = 840;
      let targetHeight = 620;

      const scale = Math.min(maxWidth / targetWidth, maxHeight / targetHeight, 1);
      const w = Math.floor(targetWidth * scale);
      const h = Math.floor(targetHeight * scale);

      canvas = new fabric.Canvas('monsterCanvas', {
        width: w,
        height: h,
        backgroundColor: '#faf7f2',
        preserveObjectStacking: true,
        selectionColor: 'rgba(255, 179, 71, 0.25)',
        selectionBorderColor: '#f97316',
        selectionLineWidth: 2
      });

      // Customize selection handles to look cute and easy to touch
      fabric.Object.prototype.set({
        transparentCorners: false,
        cornerColor: '#f97316',
        cornerStrokeColor: '#ffffff',
        borderColor: '#f97316',
        cornerSize: 14,
        cornerStyle: 'circle',
        borderScaleFactor: 2,
        padding: 6
      });

      // Freehand brush setup
      canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.color = currentPenColor;
      canvas.freeDrawingBrush.width = currentPenWidth;

      // Canvas event listeners for updating status
      canvas.on('object:added', updateCanvasStatus);
      canvas.on('object:removed', updateCanvasStatus);
      canvas.on('selection:created', onObjectSelected);
      canvas.on('selection:updated', onObjectSelected);
      canvas.on('selection:cleared', onObjectDeselected);

      // Add default welcome monster on blank canvas
      createPresetWelcomeMonster();
    }

    function updateCanvasStatus() {
      const count = canvas.getObjects().length;
      document.getElementById('canvasObjectCount').innerText = `畫布物件: ${count}`;
    }

    function onObjectSelected(e) {
      const selected = e.selected ? e.selected[0] : null;
      if (!selected) return;
      document.getElementById('selectedLabel').innerText = '已選取物件（可按「往上一層」）：';
      if (selected.fill && typeof selected.fill === 'string') {
        document.getElementById('customColorPicker').value = selected.fill.startsWith('#') ? selected.fill : '#ffd166';
      }
    }

    function onObjectDeselected() {
      document.getElementById('selectedLabel').innerText = '選取物件變色 / 著色：';
    }

    /**
     * Add Monster Body Shape to Canvas
     */
    function addMonsterBody(type) {
      if (isDrawing) toggleDrawingMode(false);

      const jitterX = (Math.random() - 0.5) * 60;
      const jitterY = (Math.random() - 0.5) * 50;
      const posX = canvas.width / 2 + jitterX;
      const posY = canvas.height / 2 + jitterY;

      let monsterObj = null;

      const shadowOpt = new fabric.Shadow({
        color: 'rgba(70, 45, 15, 0.14)',
        blur: 10,
        offsetX: 4,
        offsetY: 6
      });

      switch (type) {
        case 'white_ghost': {
          const ghostPath = new fabric.Path('M 50 14 C 30 14 22 36 22 56 Q 30 68 40 58 Q 50 68 60 58 Q 70 68 78 56 C 78 36 70 14 50 14 Z', {
            scaleX: 2.8,
            scaleY: 2.8,
            fill: '#ffffff',
            stroke: '#2b2d42',
            strokeWidth: 3.5,
            strokeLineJoin: 'round',
            originX: 'center',
            originY: 'center',
            left: posX,
            top: posY,
            shadow: shadowOpt
          });
          monsterObj = ghostPath;
          break;
        }

        case 'pumpkin': {
          const stem = new fabric.Rect({
            width: 18,
            height: 24,
            rx: 6,
            fill: '#16a34a',
            stroke: '#14532d',
            strokeWidth: 2.5,
            originX: 'center',
            originY: 'center',
            top: -65
          });
          const baseEllipse = new fabric.Ellipse({
            rx: 90,
            ry: 64,
            fill: '#ea580c',
            stroke: '#431407',
            strokeWidth: 4,
            originX: 'center',
            originY: 'center'
          });
          const rib1 = new fabric.Ellipse({
            rx: 55,
            ry: 62,
            fill: '#f97316',
            stroke: '#431407',
            strokeWidth: 3,
            originX: 'center',
            originY: 'center'
          });
          const rib2 = new fabric.Ellipse({
            rx: 28,
            ry: 58,
            fill: '#fb923c',
            stroke: '#431407',
            strokeWidth: 2,
            originX: 'center',
            originY: 'center'
          });
          monsterObj = new fabric.Group([stem, baseEllipse, rib1, rib2], {
            left: posX,
            top: posY,
            originX: 'center',
            originY: 'center',
            shadow: shadowOpt
          });
          monsterObj.mainBody = baseEllipse;
          break;
        }

        case 'oval': {
          monsterObj = new fabric.Ellipse({
            rx: 92,
            ry: 64,
            fill: '#ffd166',
            stroke: '#2b2d42',
            strokeWidth: 4,
            left: posX,
            top: posY,
            originX: 'center',

    /**
     * Stamp Student Name Badge onto Canvas (Fixed to appear clearly at bottom/center)
     */
    function addTeacherStamp() {
      if (isDrawing) toggleDrawingMode(false);

      const inputVal = (document.getElementById('studentNameInput').value || '').trim();
      const displayName = inputVal ? `創作者：${inputVal}` : '創作者：小小藝術家';

      // Remove existing student badge if present to update directly
      const existingBadge = canvas.getObjects().find(obj => obj.isStudentBadge);
      if (existingBadge) {
        canvas.remove(existingBadge);
      }

      const badgeWidth = Math.max(180, displayName.length * 20 + 40);
      const badgeBg = new fabric.Rect({
        width: badgeWidth,
        height: 48,
        rx: 14,
        ry: 14,
        fill: '#fef3c7',
        stroke: '#d97706',
        strokeWidth: 2.5,
        strokeDashArray: [5, 3]
      });

      const badgeText = new fabric.Text(displayName, {
        fontSize: 16,
        fontFamily: 'Zen Maru Gothic',
        fontWeight: '900',
        fill: '#78350f',
        left: 20,
        top: 13
      });

      const stampGroup = new fabric.Group([badgeBg, badgeText], {
        left: canvas.width / 2,
        top: canvas.height - 45,
        originX: 'center',
        originY: 'center',
        angle: -2,
        shadow: new fabric.Shadow({ color: 'rgba(180, 83, 9, 0.16)', blur: 6, offsetX: 2, offsetY: 3 })
      });

      stampGroup.isStudentBadge = true;

      canvas.add(stampGroup);
      canvas.setActiveObject(stampGroup);
      canvas.requestRenderAll();
      showToast(`已放上名字名牌：「${displayName}」！可自由拖曳或縮放`);
    }

        stroke: '#2b2d42',
        strokeWidth: 4,
        originX: 'center',
        originY: 'center',
        left: canvas.width * 0.5,
        top: canvas.height * 0.48,
        shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.1)', blur: 6, offsetX: 3, offsetY: 4 })
      });
      canvas.add(body);

      // Left eye with pupil firmly combined
      const eyeL = new fabric.Group([
        new fabric.Circle({ radius: 20, fill: '#ffffff', stroke: '#222', strokeWidth: 3, originX: 'center', originY: 'center' }),
        new fabric.Circle({ radius: 8, fill: '#222', left: 4, top: 2, originX: 'center', originY: 'center' })
      ], {
        left: canvas.width * 0.44,
        top: canvas.height * 0.41,
        originX: 'center',
        originY: 'center',
        subTargetCheck: false
      });

      // Right eye with pupil firmly combined
      const eyeR = new fabric.Group([
        new fabric.Circle({ radius: 24, fill: '#ffffff', stroke: '#222', strokeWidth: 3, originX: 'center', originY: 'center' }),
        new fabric.Circle({ radius: 9, fill: '#222', left: -2, top: 1, originX: 'center', originY: 'center' })
      ], {
        left: canvas.width * 0.56,
        top: canvas.height * 0.40,
        originX: 'center',
        originY: 'center',
        subTargetCheck: false
      });

      // Mouth and teeth firmly combined into one whole unit
      const mouthBase = new fabric.Path('M -30 -10 Q 0 30 30 -10 Z', {
        fill: '#222',
        stroke: '#222',
        strokeWidth: 2,
        originX: 'center',
        originY: 'center'
      });
      const toothL = new fabric.Rect({
        width: 8,
        height: 10,
        rx: 1,
        ry: 1,
        fill: '#fff',
        stroke: '#222',
        strokeWidth: 1,
        left: -6,
        top: -10,
        originX: 'center',
        originY: 'top'
      });
      const toothR = new fabric.Rect({
        width: 8,
        height: 10,
        rx: 1,
        ry: 1,
        fill: '#fff',
        stroke: '#222',
        strokeWidth: 1,
        left: 6,
        top: -10,
        originX: 'center',
        originY: 'top'
      });
      const welcomeMouth = new fabric.Group([mouthBase, toothL, toothR], {
        left: canvas.width * 0.5,
        top: canvas.height * 0.52,
        originX: 'center',
        originY: 'center',
        subTargetCheck: false
      });

      canvas.add(eyeL, eyeR, welcomeMouth);

      canvas.discardActiveObject();
      canvas.requestRenderAll();
    }

    function toggleDrawingMode(forceState = null) {
      if (forceState !== null) {
        isDrawing = forceState;
      } else {
        isDrawing = !isDrawing;
      }

      canvas.isDrawingMode = isDrawing;
      const btn = document.getElementById('btnToggleDraw');
      const text = document.getElementById('drawStatusText');

      if (isDrawing) {
        btn.classList.add('tool-active');
        text.innerText = '完成手繪 (回選取模式)';
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        showToast('手繪模式已啟動！可直接在畫布簽名或彩繪');
      } else {
        btn.classList.remove('tool-active');
        text.innerText = '開啟畫筆模式';
        showToast('已切換為拼貼選取模式 (可縮放/移動/旋轉/調整圖層)');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();

      // Tab switching logic
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchTab(btn.dataset.tab);
        });
      });

      // Part category sub-filters
      document.querySelectorAll('.part-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.part-filter-btn').forEach(b => {
            b.className = 'part-filter-btn px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-bold hover:bg-amber-200';
          });
          btn.className = 'part-filter-btn px-2.5 py-1 rounded-full bg-amber-600 text-white font-bold';

          const target = btn.dataset.category;
          document.querySelectorAll('.parts-grid').forEach(grid => grid.classList.add('hidden'));
          const targetGrid = document.getElementById(`cat-${target}`);
          if (targetGrid) targetGrid.classList.remove('hidden');
        });
      });

      // Drawing controls
      document.getElementById('btnToggleDraw').addEventListener('click', () => toggleDrawingMode());

      // Eraser
      document.getElementById('btnEraser').addEventListener('click', () => {
        toggleDrawingMode(true);
        canvas.freeDrawingBrush.color = '#faf7f2';
        canvas.freeDrawingBrush.width = 24;
        showToast('已切換為橡皮擦');
      });

      // Brush size slider
      document.getElementById('brushSizeSlider').addEventListener('input', (e) => {
        currentPenWidth = parseInt(e.target.value);
        document.getElementById('brushSizeVal').innerText = `${currentPenWidth} px`;
        if (canvas.freeDrawingBrush) {
          canvas.freeDrawingBrush.width = currentPenWidth;
        }
      });

      // Pen colors
      document.querySelectorAll('.pen-color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentPenColor = btn.dataset.color;
          if (canvas.freeDrawingBrush) {
            canvas.freeDrawingBrush.color = currentPenColor;
          }
          toggleDrawingMode(true);
          showToast(`已切換手寫筆顏色`, 'fa-pen text-purple-400');
        });
      });

      // Palette swatches for Coloring active selected items
      document.querySelectorAll('.palette-swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          applyColorToSelection(btn.dataset.fill);
        });
      });

      // Custom color picker input
      document.getElementById('customColorPicker').addEventListener('input', (e) => {
        applyColorToSelection(e.target.value);
      });

      // Quick Stamp button & Enter key on Student Name input
      document.getElementById('btnQuickStamp').addEventListener('click', addTeacherStamp);
      document.getElementById('studentNameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          addTeacherStamp();
        }
      });

      // Layer controls: Bring Up One Layer (往上一層)
      document.getElementById('btnBringUp').addEventListener('click', () => {
        const obj = canvas.getActiveObject();
        if (obj) {
          canvas.bringForward(obj);
          canvas.requestRenderAll();
          showToast('已將物件往上一層！', 'fa-arrow-up text-amber-500');
        } else {
          showToast('請先點選想要往上一層的怪獸或五官喔！', 'fa-hand-pointer text-amber-400');
        }
      });

      // Layer controls: Send Down One Layer (往下一層)
      document.getElementById('btnSendDown').addEventListener('click', () => {
        const obj = canvas.getActiveObject();
        if (obj) {
          canvas.sendBackwards(obj);
          canvas.requestRenderAll();
          showToast('已將物件往下一層！', 'fa-arrow-down text-slate-500');
        } else {
          showToast('請先點選想要往下一層的怪獸或五官喔！', 'fa-hand-pointer text-amber-400');
        }
      });

      // Layer controls: Bring to absolute front
      document.getElementById('btnBringFront').addEventListener('click', () => {
        const obj = canvas.getActiveObject();
        if (obj) {
          canvas.bringToFront(obj);
          canvas.requestRenderAll();
          showToast('已將物件移至最上層');
        }
      });

      // Layer controls: Send to absolute back
      document.getElementById('btnSendBack').addEventListener('click', () => {
        const obj = canvas.getActiveObject();
        if (obj) {
          canvas.sendToBack(obj);
          canvas.requestRenderAll();
          showToast('已將物件移至最下層');
        }
      });

      // Duplicate button
      document.getElementById('btnDuplicate').addEventListener('click', () => {
        const active = canvas.getActiveObject();
        if (!active) return;
        active.clone((cloned) => {
          cloned.set({
            left: active.left + 24,
            top: active.top + 24,
            evented: true
          });
          canvas.add(cloned);
          canvas.setActiveObject(cloned);
          canvas.requestRenderAll();
          showToast('已複製一份！');
        });
      });

      // Delete selected
      document.getElementById('btnDeleteSelected').addEventListener('click', () => {
        const active = canvas.getActiveObject();
        if (active) {
          canvas.remove(active);
          canvas.discardActiveObject();
          canvas.requestRenderAll();
          showToast('已刪除所選物件');
        }
      });

      // Clear Canvas Modal controls - Truly Clear to empty
      const confirmModal = document.getElementById('confirmModal');
      document.getElementById('btnClear').addEventListener('click', () => {
        confirmModal.classList.remove('hidden');
      });
      document.getElementById('btnCancelClear').addEventListener('click', () => {
        confirmModal.classList.add('hidden');
      });
      document.getElementById('btnConfirmClear').addEventListener('click', () => {
        confirmModal.classList.add('hidden');
        // Clear all objects from canvas completely
        canvas.clear();
        canvas.backgroundColor = '#faf7f2';
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        updateCanvasStatus();
        showToast('畫布已徹底清空，可以完全自由創作！', 'fa-trash-can text-rose-400');
      });

      // Export / Save Photo button
      document.getElementById('btnExport').addEventListener('click', exportArtworkImage);

      // Handle window resize dynamically while preserving ratio
      window.addEventListener('resize', handleCanvasResize);
    });

    /**
     * Switch Left Tabs
     */
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.tab === tabId) {
          btn.classList.add('active-tab', 'text-amber-900', 'bg-white', 'shadow-sm');
          btn.classList.remove('text-amber-800');
        } else {
          btn.classList.remove('active-tab', 'text-amber-900', 'bg-white', 'shadow-sm');
          btn.classList.add('text-amber-800');
        }
      });

      document.getElementById('tab-bodies').classList.toggle('hidden', tabId !== 'bodies');
      document.getElementById('tab-parts').classList.toggle('hidden', tabId !== 'parts');
      document.getElementById('tab-paint').classList.toggle('hidden', tabId !== 'paint');

      if (tabId === 'paint') {
        toggleDrawingMode(true);
      } else {
        if (isDrawing) toggleDrawingMode(false);
      }
    }

    /**
     * Apply fill/tint color to current selected object or its main geometry
     */
    function applyColorToSelection(color) {
      const active = canvas.getActiveObject();
      if (!active) {
        showToast('請先在畫布上點選想變色的怪獸或五官喔！', 'fa-hand-pointer text-amber-400');
        return;
      }

      if (active.type === 'group') {
        const items = active.getObjects();
        if (items.length > 0) {
          items[0].set('fill', color);
        }
      } else {
        active.set('fill', color);
      }
      canvas.requestRenderAll();
      showToast('變色成功！', 'fa-palette text-amber-500');
    }

    /**
     * Export artwork as a high quality PNG photo download
     */
    function exportArtworkImage() {
      canvas.discardActiveObject();
      canvas.requestRenderAll();

      try {
        const dataURL = canvas.toDataURL({
          format: 'png',
          quality: 1.0,
          multiplier: 2
        });

        const downloadLink = document.createElement('a');
        const timestamp = new Date().toISOString().slice(0, 10);
        const namePart = (document.getElementById('studentNameInput').value || '').trim();
        downloadLink.download = `奇幻怪獸作品_${namePart || '小小藝術家'}_${timestamp}.png`;
        downloadLink.href = dataURL;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        showToast('🎉 作品照片下載成功！可分享給陳老師與好友', 'fa-circle-down text-emerald-400');
      } catch (err) {
        showToast('儲存失敗，請重試', 'fa-circle-exclamation text-rose-400');
      }
    }

    /**
     * Maintain canvas display scale on screen resize without distorting content
     */
    function handleCanvasResize() {
      const container = document.getElementById('canvasContainer');
      if (!container || !canvas) return;

      const maxWidth = Math.min(container.clientWidth - 16, 960);
      const maxHeight = Math.min(container.clientHeight - 16, 720);
      const targetWidth = 840;
      const targetHeight = 620;

      const scale = Math.min(maxWidth / targetWidth, maxHeight / targetHeight, 1);
      const newWidth = Math.floor(targetWidth * scale);
      const newHeight = Math.floor(targetHeight * scale);

      canvas.setDimensions({ width: newWidth, height: newHeight });
      canvas.requestRenderAll();
    }
  </script>
</body>
</html>
